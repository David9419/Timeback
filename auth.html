<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeback — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;
    --panel:#101B30;
    --panel-2:#152340;
    --line:rgba(231,236,243,0.10);
    --text:#E7ECF3;
    --muted:#93A2B8;
    --cyan:#22D3EE;
    --emerald:#34D399;
    --grad: linear-gradient(115deg, var(--cyan), var(--emerald));
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--text);
    font-family:'Inter', Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px;
    position:relative; overflow:hidden;
  }
  h1,h2{ font-family:'Space Grotesk', sans-serif; font-weight:700; margin:0; }
  a{ color:inherit; }
  .ambient{ position:fixed; inset:0; z-index:-1; }
  .ambient::before, .ambient::after{
    content:""; position:absolute; border-radius:50%; filter:blur(110px); opacity:0.35;
  }
  .ambient::before{ width:640px; height:640px; top:-220px; left:-180px; background:radial-gradient(circle, var(--cyan), transparent 65%); }
  .ambient::after{ width:600px; height:600px; bottom:-220px; right:-160px; background:radial-gradient(circle, var(--emerald), transparent 65%); opacity:0.28; }

  .top-logo{ position:fixed; top:28px; left:32px; display:flex; align-items:center; gap:10px; text-decoration:none; }
  .top-logo span{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; color:var(--text); }
  .grad-text{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .card{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:38px 34px; box-shadow:0 30px 70px -30px rgba(0,0,0,0.6);
  }
  .card h1{ font-size:24px; margin-bottom:6px; }
  .card .sub{ color:var(--muted); font-size:14px; margin-bottom:26px; }

  .tabs{ display:flex; background:var(--panel-2); border-radius:12px; padding:4px; margin-bottom:26px; }
  .tab{
    flex:1; text-align:center; padding:10px; border-radius:9px; font-size:14px; font-weight:600;
    color:var(--muted); cursor:pointer; transition:.2s ease;
  }
  .tab.active{ background:var(--grad); color:var(--ink); }

  form{ display:none; flex-direction:column; gap:16px; }
  form.active{ display:flex; }

  label{ font-size:13px; color:var(--muted); margin-bottom:6px; display:block; }
  input[type=text], input[type=email], input[type=password]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14.5px; font-family:'Inter', sans-serif;
  }
  input:focus{ outline:none; border-color:rgba(52,211,153,0.6); }

  .row-between{ display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--muted); }
  .row-between a{ color:var(--emerald); text-decoration:none; }
  .checkbox-line{ display:flex; align-items:center; gap:8px; }
  .checkbox-line input{ accent-color:var(--emerald); }

  .btn-primary{
    padding:13px; border-radius:10px; background:var(--grad); color:var(--ink);
    font-weight:700; font-size:15px; border:none; cursor:pointer; margin-top:4px;
  }
  .divider{ display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12.5px; margin:22px 0 18px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  .btn-google{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn-google:hover{ border-color:rgba(231,236,243,0.3); }

  .switch-line{ text-align:center; font-size:13.5px; color:var(--muted); margin-top:22px; }
  .switch-line span{ color:var(--emerald); cursor:pointer; font-weight:600; }

  .preview-note{
    text-align:center; font-size:11.5px; color:var(--muted); opacity:0.7; margin-top:20px;
  }
</style>
</head>
<body>

<div class="ambient"></div>

<a class="top-logo" href="index.html">
  <svg width="28" height="28" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/>
      </linearGradient>
    </defs>
    <circle cx="250" cy="190" r="100" fill="none" stroke="url(#ring)" stroke-width="15"/>
    <g stroke="#0B1220" stroke-width="6" stroke-linecap="round">
      <line x1="250" y1="110" x2="250" y2="125"/>
      <line x1="299.3" y1="126.7" x2="290.5" y2="137.3"/>
      <line x1="321.7" y1="169.2" x2="308" y2="174.7"/>
      <line x1="321.7" y1="210.8" x2="308" y2="205.3"/>
      <line x1="299.3" y1="253.3" x2="290.5" y2="242.7"/>
      <line x1="250" y1="270" x2="250" y2="255"/>
      <line x1="200.7" y1="253.3" x2="209.5" y2="242.7"/>
      <line x1="178.3" y1="210.8" x2="192" y2="205.3"/>
      <line x1="178.3" y1="169.2" x2="192" y2="174.7"/>
      <line x1="200.7" y1="126.7" x2="209.5" y2="137.3"/>
    </g>
    <line x1="250" y1="190" x2="308" y2="110" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="250" cy="190" r="14" fill="#0B1220"/>
    <circle cx="250" cy="190" r="5.5" fill="url(#ring)"/>
  </svg>
  <span>Time<span class="grad-text">back</span></span>
</a>

<div class="card">
  <h1 id="cardTitle">Content de te revoir</h1>
  <p class="sub" id="cardSub">Connecte-toi pour retrouver ton assistant.</p>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="showForm('login')">Connexion</div>
    <div class="tab" id="tabSignup" onclick="showForm('signup')">Inscription</div>
  </div>

  <form id="formLogin" class="active" onsubmit="window.location.href='dashboard.html'; return false;">
    <div>
      <label for="loginEmail">Adresse e-mail</label>
      <input type="email" id="loginEmail" placeholder="toi@exemple.com">
    </div>
    <div>
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <div class="row-between">
      <label class="checkbox-line"><input type="checkbox"> Se souvenir de moi</label>
      <a href="#">Mot de passe oublié ?</a>
    </div>
    <button type="submit" class="btn-primary">Se connecter</button>
  </form>

  <form id="formSignup" onsubmit="window.location.href='dashboard.html'; return false;">
    <div>
      <label for="signupName">Nom</label>
      <input type="text" id="signupName" placeholder="Ton nom">
    </div>
    <div>
      <label for="signupEmail">Adresse e-mail</label>
      <input type="email" id="signupEmail" placeholder="toi@exemple.com">
    </div>
    <div>
      <label for="signupPassword">Mot de passe</label>
      <input type="password" id="signupPassword" placeholder="••••••••">
    </div>
    <div>
      <label for="signupPassword2">Confirmer le mot de passe</label>
      <input type="password" id="signupPassword2" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-primary">Créer mon compte</button>
  </form>

  <div class="divider">ou</div>
  <button class="btn-google" onclick="return false;">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8c-.2 1.1-.9 2.1-1.9 2.7v2.3h3a9 9 0 0 0 2.7-6.6Z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-3-2.3c-.8.6-1.9.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M4 10.7a5.4 5.4 0 0 1 0-3.4V5H1a9 9 0 0 0 0 8l3-2.3Z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 1 5l3 2.3C4.7 5.2 6.7 3.6 9 3.6Z"/></svg>
    Continuer avec Google
  </button>

  <div class="switch-line" id="switchLine">
    Pas encore de compte ? <span onclick="showForm('signup')">Inscris-toi</span>
  </div>

  <p class="preview-note">Aperçu visuel — la connexion réelle sera activée une fois Supabase branché.</p>
</div>

<script>
  function showForm(which){
    const isLogin = which === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    document.getElementById('formLogin').classList.toggle('active', isLogin);
    document.getElementById('formSignup').classList.toggle('active', !isLogin);
    document.getElementById('cardTitle').textContent = isLogin ? 'Content de te revoir' : 'Crée ton compte';
    document.getElementById('cardSub').textContent = isLogin ? 'Connecte-toi pour retrouver ton assistant.' : 'Rejoins Timeback en quelques secondes.';
    document.getElementById('switchLine').innerHTML = isLogin
      ? 'Pas encore de compte ? <span onclick="showForm(\'signup\')">Inscris-toi</span>'
      : 'Déjà un compte ? <span onclick="showForm(\'login\')">Connecte-toi</span>';
  }
</script>

</body>
</html>
